[package]
name = "markview"
version = "0.5.0"
edition = "2024"
repository = "https://github.com/luizbafilho/markview"
publish = false

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
base64-simd = "0.8.0"
catppuccin = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ratatui = "0.29"
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
ratatui-markdown = { version = "0.3.6", features = ["highlight-lang-all"] }
terminal-colorsaurus = "1"
unicode-width = "0.2.0"

[target.'cfg(target_os = "macos")'.dependencies]
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
ambiguous_negative_literals = "warn"

[lints.clippy]
# groups
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }

# panic / incompleteness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
exit = "deny"

# LLM favorites
redundant_clone = "deny"
clone_on_copy = "deny"
clone_on_ref_ptr = "warn"
unnecessary_to_owned = "deny"
useless_asref = "deny"
needless_pass_by_value = "warn"
needless_borrow = "deny"
needless_lifetimes = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
inefficient_to_string = "deny"
or_fun_call = "warn"
map_clone = "deny"

# error handling
unwrap_or_default = "warn"
map_err_ignore = "deny"
unused_result_ok = "deny"

# style that agents get wrong
fn_to_numeric_cast_any = "deny"
if_then_some_else_none = "warn"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
empty_drop = "deny"
assertions_on_result_states = "warn"

# pedantic noise
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
cargo_common_metadata = "allow"  # private binary, never published to crates.io
multiple_crate_versions = "allow"  # duplicates come from ratatui/image transitive deps
# Terminal geometry mixes u16 cells, usize rows and f64 pixel ratios; values are bounded by screen size.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true

[package.metadata.release]
pre-release-commit-message = "Release {{crate_name}} {{version}}"
