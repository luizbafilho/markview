[package]
name = "mkviewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64-simd = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ratatui = "0.29"
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
ratatui-markdown = { version = "0.3.6", features = ["highlight-lang-all"] }
unicode-width = "0.2.0"
